name: Daily update (cloud fallback)

# Belt and braces for the Mac launchd job: if the Mac was asleep / offline and the
# published data is still behind the latest US trading day, this runner fetches,
# recomputes and commits the outputs itself (→ deploy.yml publishes the site).
#
#   21:30 UTC = early attempt (05:30 Taipei) — delay insurance, see below
#   22:00 UTC = early retry (06:00 Taipei)
  #   22:15 UTC = 18:15 ET (EDT) / 17:15 ET (EST)  — after the close + data settle (06:15 Taipei)
#   23:00 UTC = retry (07:00 Taipei); 00:30 UTC = last chance (08:30 Taipei)
#   Each run first checks whether the published data is already current and exits in seconds if so,
#   so the extra crons cost nothing on normal days.  The Mac job runs at 23:30 UTC / 07:30 Taipei;
#   when the Mac cannot push (no GitHub SSH key), these runs are the only thing that refreshes the site.
#   Outputs committed: JSON, HTML, feed/, meta/ (the Muse pack), history/.
#
#   2026-10-27 lesson: GitHub's scheduler slipped ~3h (the 06:15/07:00/08:30 Taipei crons did
#   not start until 09:29/09:54 Taipei), so morning readers saw stale Pages at 07:30 and 09:00.
#   The 05:30/06:00 crons are extra lottery tickets against that delay; they cannot cure a
#   platform-wide slip, which is why the Muse-side morning delivery no longer depends on
#   Pages freshness (it reads its own 06:30 bundle first). Provisional data is tolerated
#   (labeled) by the morning instant-version rule.

on:
  schedule:
    - cron: "30 21 * * 1-5"   # 05:30 Taipei (Tue-Sat): early attempt, delay insurance
    - cron: "0 22 * * 1-5"    # 06:00 Taipei (Tue-Sat): early retry
    - cron: "15 22 * * 1-5"   # 06:15 Taipei (Tue-Sat): first attempt after the US close
    - cron: "0 23 * * 1-5"    # 07:00 Taipei: retry if the first run was late or data not ready
    - cron: "30 0 * * 2-6"    # 08:30 Taipei: last chance (also covers the Mac job at 07:30 Taipei failing to push)
            
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if data is already current"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: "daily-update"
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Is the published data stale?
        id: stale
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib
          from soxl_quant import marketclock
          exp = marketclock.expected_latest_trading_date().isoformat()
          try:
              cur = json.loads(pathlib.Path("soxl_analysis_data.json").read_text())["data_as_of"]
          except Exception:
              cur = ""
          stale = (not cur) or cur < exp
          print(f"expected={exp}")
          print(f"current={cur}")
          print(f"stale={'true' if stale else 'false'}")
          PY

      - name: Optional delivery config from secret (SOXL_NOTIFY_CONFIG_JSON)
        id: notify
        if: steps.stale.outputs.stale == 'true' || inputs.force == true
        env:
          NOTIFY_JSON: ${{ secrets.SOXL_NOTIFY_CONFIG_JSON }}
        shell: bash
        run: |
          # The secret is the full content of notify_config.json (webhook / chat / telegram / line / email channels).
          # It is written next to the code with mode 0600 and is git-ignored; the commit step below adds explicit paths only.
          if [ -n "$NOTIFY_JSON" ]; then
            printf '%s' "$NOTIFY_JSON" > notify_config.json
            chmod 600 notify_config.json
            if python3 -c "import json; json.load(open('notify_config.json'))"; then
              echo "enabled=true" >> "$GITHUB_OUTPUT"; echo "delivery: enabled from secret"
            else
              echo "enabled=false" >> "$GITHUB_OUTPUT"; echo "::warning::SOXL_NOTIFY_CONFIG_JSON is not valid JSON; notifications skipped"; rm -f notify_config.json
            fi
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"; echo "delivery: no secret, notifications off"
          fi

      - name: Run pipeline
        if: steps.stale.outputs.stale == 'true' || inputs.force == true
        env:
          PYTHONUTF8: "1"
          SOXL_TRIGGER: "github-actions"
          NOTIFY_ENABLED: ${{ steps.notify.outputs.enabled }}
        shell: bash
        run: |
          echo "expected ${{ steps.stale.outputs.expected }}  current ${{ steps.stale.outputs.current }}"
          if [ "$NOTIFY_ENABLED" = "true" ]; then FLAG=""; else FLAG="--no-notify"; fi
          python3 auto_update.py run $FLAG --no-publish --retries 2 --wait-min 3

      - name: Verify outputs
        if: steps.stale.outputs.stale == 'true' || inputs.force == true
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          d = json.loads(pathlib.Path("soxl_analysis_data.json").read_text())
          b = json.loads(pathlib.Path("feed/latest.json").read_text())
          print("data_as_of", d["data_as_of"], "verdict", b["verdict"]["label"], "warnings", d.get("warnings"))
          for f in ("index.html", "soxl_analysis_report.html", "soxl_simple.html", "feed/latest.md", "feed/rss.xml"):
              p = pathlib.Path(f)
              assert p.exists() and p.stat().st_size > 1000, f"missing/empty {f}"
          sys.exit(0)
          PY

      - name: Commit & push
        if: steps.stale.outputs.stale == 'true' || inputs.force == true
        shell: bash
        run: |
          git config user.name "soxl-quant-bot"
          git config user.email "soxl-quant-bot@users.noreply.github.com"
          git add -A -- soxl_analysis_data.json soxl_analysis_report.html index.html soxl_simple.html feed meta history/verdicts.jsonl history/snapshots
          if git diff --cached --quiet; then
            echo "no changes"; exit 0
          fi
          DATE=$(python3 -c "import json;print(json.load(open('soxl_analysis_data.json'))['data_as_of'])")
          VERDICT=$(python3 -c "import json;b=json.load(open('feed/latest.json'))['verdict'];print(f\"{b.get('emoji') or ''} {b.get('label') or ''}\")")
          git commit -q -m "data: ${DATE} ${VERDICT} [github-actions]"
          git pull --rebase -X theirs origin main || true
          git push origin HEAD:main
